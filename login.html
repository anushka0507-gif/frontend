<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

       
        <div class="logo">
            <div class="logo-icon">✚</div>

            <div>
                <h1>Gramin Arogya Kendra</h1>
                <p>Rural Healthcare Platform</p>
            </div>
        </div>

        <p class="tagline">Better Health • Brighter Tomorrow</p>


       
        <div class="login-card">

            <h2>Login</h2>

            <p class="subtitle">
                Access your  account
            </p>


          
            <div class="input-box">
                <span class="icon">♙</span>

                <select>
                    <option value="" disabled selected>
                        Select Your Role
                    </option>

                    <option>Admin</option>
                    <option>Health Worker</option>
                    <option>Doctor</option>
                    <option>Patient</option>
                </select>
            </div>


            <div class="input-box">
                <span class="icon">✉</span>

                <input
                    type="text"
                    placeholder="Email / Mobile Number"
                >
            </div>


           
             <div class="input-box"> 
                <span class="icon">🔒</span>

                <input
                    type="password"
                    placeholder="Password"
                >
            </div>


            
            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>


          
            <button class="login-btn">
                Login <span>→</span>
            </button>


            
            <div class="register">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </div>

        </div>

   
        
    </body>
    </html>
